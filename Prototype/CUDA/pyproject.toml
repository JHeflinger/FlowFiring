[project]
name = "flowfiring"
version = "0.1.0"
description = "Package for visualizing and parallelizing flow firing"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3",
    "pybind11[global]>=3.0.1",
]

[tool.uv]
package = true

[build-system]
requires = [
    "scikit-build-core",
    "pybind11",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.build-type = "Release"
cmake.source-dir = "flowfiring/_native"
wheel.packages = ["flowfiring"]
editable.mode = "inplace"
