name: macOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install \
            shaderc \
            molten-vk \
            vulkan-headers \
            vulkan-loader \
            glfw \
            raylib

      - name: Set Vulkan environment (Homebrew paths)
        run: |
          echo "VULKAN_SDK=/opt/homebrew" >> $GITHUB_ENV
          echo "CPATH=/opt/homebrew/include:$CPATH" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/opt/homebrew/lib:$LIBRARY_PATH" >> $GITHUB_ENV

      - name: Build (production)
        run: ./publish_macos.sh

      - name: Package .app bundle
        run: ./package_macos.sh

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prism-macOS
          path: Prism.zip
          if-no-files-found: error
